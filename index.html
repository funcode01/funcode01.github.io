<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dialog</title>
<style>
input,button {
  font-size: inherit;
}

.dialog-form {
  max-width: 20em;
  border: 1px solid #f5f5f5;
  box-shadow: 0 1px 3px rgba(0 0 0 / 30%);
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
  padding: 0 1.5em 1.5em;
  border-radius: .5rem;
  background-color: #F2F2F2;
}
.dialog-form::backdrop {
  background-color: hsla(0, 0%, 0%, .2);
}
.dialog-form h5 {
  font-size: 1.1rem;
  text-align: center;
  margin: 1rem 0 1.5rem;
}
.dialog-form .close {
  color: gray;
  line-height: 1;
  cursor: pointer;
  position: absolute;
  top: .8rem;
  right: 0;
  transform: scale(1.5);
  transform-origin: 100% 0%;
  padding: .1em .2em;
}
.dialog-form p {
  display: flex;
}
.dialog-form label {
  flex: 3em;
  text-align: right;
  margin-right: .5em;
}
.dialog-form button {
  width: calc(100% - 3.5em);
  margin-left: 3.5em;
  padding: .3rem 1.5rem;
  color: white;
  background-color: #DE1D1D;
  border-radius: 8px;
  border: 0;
}
.dialog-alert button:focus {
  outline: 0;
}
</style>
</head>

<body>
<h1>dialog</h1>
<p>未指定form的method属性值，提交类型按钮无法关闭。需通过JS来解决。单击“登陆”，将弹出对话框。单击对话框右上角的×会关闭对话框。</p>
<p>后期可添加获得对话框中控件的值。</p>
<p><button class="login">登陆</button></p>
<dialog class="dialog-form">
  <h5>登陆</h5>
  <form action="demo.js">
    <p>
      <label>用户名</label>
      <input type="text">
    </p>
    <p>
      <label>密码</label>
      <input type="text">
    </p>
    <button type="submit">登陆</button>
  </form>
  <span class="close">×</span>
</dialog>

<script>
  let dialog= document.querySelector('dialog');
  document.querySelector('.login').onclick = () => dialog.showModal();
  document.querySelector('.close').onclick= () => dialog.close();
</script>
</body>
</html>
